<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setting - Pomodoro</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <main class="container">
    <h3>Setting</h3>

    <div class="field">
      <label for="timer-minutes">타이머 시간 (분)</label>
      <input type="number" id="timer-minutes" name="timer-minutes" min="1" max="60" value="25">
    </div>

    <div class="actions">
      <button type="button" class="btn btn-save" disabled>저장</button>
      <a href="index.html" class="btn btn-back">메인 페이지로 돌아가기</a>
    </div>
  </main>
  <script src="settings.js"></script>
</body>
</html>
